<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="ParlAR requiere atención">
  <title>ParlAR requiere atención</title>
  <!-- Misma silueta: el cursor ocupa la misma columna, en ámbar y con un
       corte interno que lo vuelve signo de atención. -->
  <g fill="#8E8B86">
    <rect x="2" y="7" width="2" height="2" rx="1"/>
    <rect x="5" y="5" width="2" height="6" rx="1"/>
    <rect x="8" y="6" width="2" height="4" rx="1"/>
  </g>
  <g fill="#C98A28">
    <rect x="11" y="3" width="2" height="7" rx="1"/>
    <rect x="11" y="11" width="2" height="2" rx="1"/>
  </g>
</svg>
