name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Acciones fijadas por SHA completo del commit de la release indicada en el
# comentario (formato que Dependabot actualiza). Ver
# docs/security/supply-chain.md.

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tested dependencies
        # constraints.txt fija la misma resolución que instala el release.
        # setuptools llega fijado por constraints (lo requiere ctranslate2) y
        # construye el wheel de las pruebas; es la misma versión que el
        # toolchain del job wheel-contract y de release.yml.
        run: >-
          python -m pip install --disable-pip-version-check
          -c constraints.txt -r requirements.txt wheel==0.48.0

      - name: Verify tested versions match constraints.txt
        run: python scripts/check_dependencies.py entorno

      - name: Run the same quality gate as local development
        env:
          PARLAR_PYTHON: python
        run: ./scripts/check.sh

  wheel-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install pinned wheel build toolchain
        run: >-
          python -m pip install --disable-pip-version-check
          setuptools==84.1.0 wheel==0.48.0

      - name: Build and inspect wheel
        run: |
          WHEEL_DIR="$RUNNER_TEMP/parlar-dist"
          mkdir -p "$WHEEL_DIR"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          python -m pip wheel \
            --no-deps \
            --no-build-isolation \
            --wheel-dir "$WHEEL_DIR" \
            .
          python scripts/check_wheel_contract.py \
            wheel "$WHEEL_DIR" pyproject.toml

      - name: Install the built wheel in a clean venv
        run: |
          WHEEL_DIR="$RUNNER_TEMP/parlar-dist"
          SMOKE_VENV="$RUNNER_TEMP/parlar-wheel-smoke"
          python -m venv "$SMOKE_VENV"
          "$SMOKE_VENV/bin/python" -m pip install \
            --disable-pip-version-check \
            -c constraints.txt \
            "$WHEEL_DIR"/parlar-*.whl

      - name: Smoke installed artifact outside the checkout
        run: |
          SMOKE_VENV="$RUNNER_TEMP/parlar-wheel-smoke"
          SMOKE_DIR="$RUNNER_TEMP/parlar-smoke"
          mkdir -p "$SMOKE_DIR"
          cp scripts/check_wheel_contract.py \
            "$RUNNER_TEMP/check_wheel_contract.py"
          cd "$SMOKE_DIR"
          unset PYTHONPATH
          "$SMOKE_VENV/bin/python" \
            "$RUNNER_TEMP/check_wheel_contract.py" \
            installed "$GITHUB_WORKSPACE/pyproject.toml" "$GITHUB_WORKSPACE"
          "$SMOKE_VENV/bin/parlar" --help
          "$SMOKE_VENV/bin/parlarctl" --help
